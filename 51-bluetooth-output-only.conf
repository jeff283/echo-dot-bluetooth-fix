# Two-way speakers (Amazon Echo) fail with BlueZ >= 5.86: the PC's A2DP sink
# endpoint and the speaker's A2DP sink race during SetConfiguration
# ("Stream End Point in Use" / "Connection timed out"). Dropping the PC's
# a2dp_sink role means the PC only ever sends audio to the speaker.
# Side effect: the PC can no longer act as a Bluetooth speaker for a phone.
# Delete this file and run `systemctl --user restart wireplumber` to undo.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_source bap_sink bap_source hsp_ag hfp_ag ]
}
